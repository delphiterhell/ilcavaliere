<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" preserveAspectRatio="none">
  <!-- Texture d'acqua: due strati di rumore allungato in orizzontale,
       uno blu Egeo e uno azzurro chiaro, come riflessi sfocati. -->
  <filter id="acqua" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.0028 0.012" numOctaves="3" seed="11" result="n1"/>
    <feColorMatrix in="n1" type="matrix" result="egeo"
      values="0 0 0 0 0.25
              0 0 0 0 0.53
              0 0 0 0 0.64
              2.4 0 0 0 -0.95"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.006 0.03" numOctaves="2" seed="4" result="n2"/>
    <feColorMatrix in="n2" type="matrix" result="azzurro"
      values="0 0 0 0 0.66
              0 0 0 0 0.83
              0 0 0 0 0.88
              0 3 0 0 -1.3"/>
    <feMerge>
      <feMergeNode in="egeo"/>
      <feMergeNode in="azzurro"/>
    </feMerge>
  </filter>
  <rect width="100%" height="100%" filter="url(#acqua)"/>
</svg>
